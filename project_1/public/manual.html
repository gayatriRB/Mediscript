<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediRx - Manual Prescription Formulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f0f7ff 0%, #e2efff 50%, #edf4fc 100%);
            min-height: 100vh;
            color: #1e293b;
            overflow-x: hidden;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 4rem;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.6rem;
            font-weight: 700;
            color: #0284c7;
            letter-spacing: -0.5px;
        }

        .brand span { color: #0f172a; font-weight: 400; }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #475569;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .nav-links a:hover { color: #0284c7; }

        .btn-logout {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white !important;
            padding: 8px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.2);
        }

        .main-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .portal-heading {
            font-size: 2rem;
            color: #0f172a;
            font-weight: 800;
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 32px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.04);
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .form-row {
            display: flex;
            gap: 1.5rem;
            width: 100%;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #475569;
        }

        label .required {
            color: #ef4444;
            margin-left: 3px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1rem;
            color: #0f172a;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
            background: #ffffff;
        }

        .btn-popup-trigger {
            background: #e0f2fe;
            border: 1px dashed #0284c7;
            color: #0369a1;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .btn-popup-trigger:hover {
            background: #bae6fd;
        }

        .selected-tags-box {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .tag-pill {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #334155;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(6px);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: #ffffff;
            border-radius: 24px;
            padding: 2.5rem;
            width: 90%;
            max-width: 650px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0f172a;
        }

        .checkbox-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checkbox-label {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 0.95rem;
            color: #1e293b;
            cursor: pointer;
            background: #f8fafc;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .checkbox-label input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-top: 2px;
            cursor: pointer;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn-modal-close {
            background: #f1f5f9;
            border: none;
            padding: 10px 22px;
            border-radius: 50px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
        }

        .btn-modal-apply {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border: none;
            padding: 10px 28px;
            border-radius: 50px;
            font-weight: 600;
            color: white;
            cursor: pointer;
        }

        .mode-buttons-row {
            display: flex;
            gap: 1rem;
            width: 100%;
            margin-top: 0.5rem;
        }

        .btn-mode {
            flex: 1;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 14px;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 0.95rem;
        }

        .btn-mode:hover {
            background: #ffffff;
            border-color: #0284c7;
            color: #0284c7;
        }

        .btn-mode.active {
            background: #e0f2fe;
            border-color: #0284c7;
            color: #0369a1;
        }

        .sub-form-container {
            display: none;
            background: rgba(248, 250, 252, 0.7);
            border: 1px dashed #cbd5e1;
            border-radius: 20px;
            padding: 2rem;
            flex-direction: column;
            gap: 1.5rem;
        }

        .btn-submit-container {
            width: 100%;
            margin-top: 1rem;
        }

        .btn-main-submit {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: white;
            padding: 16px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.25);
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn-main-submit:hover {
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.45);
            transform: translateY(-2px);
        }

        .autofill-alert {
            font-size: 0.85rem;
            font-weight: 600;
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 5px;
            display: none;
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">MediRx<span>+</span></div>
        <ul class="nav-links">
            <li><a href="home.html">Dashboard</a></li>
            <li><a href="list.html">Records</a></li>
            <li><a href="index.html" class="btn-logout">Logout</a></li>
        </ul>
    </nav>

    <main class="main-container">
        <h1 class="portal-heading">Manual Prescription Formulation</h1>

        <div id="autofillStatus" class="autofill-alert"></div>

        <form id="prescriptionForm" onsubmit="saveToFirebase(event)" class="form-card">
            
            <div class="form-row">
                <div class="form-group">
                    <div style="display: none;"><input type="date" id="system_date"></div> 
                    <label for="mrd_no">MRD No (Optional)</label>
                    <input type="text" id="mrd_no" name="mrd_no" placeholder="Enter registration code if any..." onblur="checkAndAutofillMRD()">
                </div>
                <div class="form-group">
                    <div style="display: none;"><input type="text" id="selected_mode" value="none"></div>
                    <label for="patient_name">Patient Name<span class="required">*</span></label>
                    <input type="text" id="patient_name" name="patient_name" placeholder="Enter patient full name..." required>
                </div>
            </div>

            <!-- Lab Metrics Input Values Row -->
            <div class="form-row">
                <div class="form-group">
                    <label for="hc_val">HC (Homocysteine)</label>
                    <input type="text" id="hc_val" name="hc_val" placeholder="Value...">
                </div>
                <div class="form-group">
                    <label for="vit_d">Vit D</label>
                    <input type="text" id="vit_d" name="vit_d" placeholder="Value...">
                </div>
                <div class="form-group">
                    <label for="fe_val">Fe (Ferritin)</label>
                    <input type="text" id="fe_val" name="fe_val" placeholder="Value...">
                </div>
            </div>

            <!-- Smart Compact Section for Medications Selection -->
            <div style="background: rgba(248, 250, 252, 0.8); border: 1px solid #cbd5e1; border-radius: 20px; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem;">
                
                <!-- 1. Homocysteine Selector -->
                <div class="form-group">
                    <label>1) For Homocysteine Medications</label>
                    <button type="button" class="btn-popup-trigger" onclick="openModal('hcModal')">
                        <span>Select Homocysteine Options...</span>
                        <span>▼</span>
                    </button>
                    <div class="selected-tags-box" id="hcTagsBox"></div>
                </div>

                <!-- 2. Vit D Selector & Dosage -->
                <div class="form-row">
                    <div class="form-group">
                        <label>2) For Vit D Medications</label>
                        <button type="button" class="btn-popup-trigger" onclick="openModal('vitModal')">
                            <span>Select Vit D Options...</span>
                            <span>▼</span>
                        </button>
                        <div class="selected-tags-box" id="vitTagsBox"></div>
                    </div>
                    <div class="form-group">
                        <label for="select_vit_dosage">Vit D Dosage Duration</label>
                        <select id="select_vit_dosage" name="select_vit_dosage">
                            <option value="" selected disabled>Select duration...</option>
                            <option value="For 5 weeks. Then start following tablet. ५ आठवड्यांसाठी. नंतर खालील गोळी सुरू करणे.">i) For 5 weeks. Then start following tablet. ५ आठवड्यांसाठी. नंतर खालील गोळी सुरू करणे.</option>
                            <option value="For 4 weeks. Then start following tablet. ५ आठवड्यांसाठी. नंतर खालील गोळी सुरू करणे.">ii) For 4 weeks. Then start following tablet. ५ आठवड्यांसाठी. नंतर खालील गोळी सुरू करणे.</option>
                            <option value="For 3 weeks. Then start following tablet. ५ आठवड्यांसाठी. नंतर खालील गोळी सुरू करणे.">iii) For 3 weeks. Then start following tablet. ५ आठवड्यांसाठी. नंतर खालील गोळी सुरू करणे.</option>
                            <option value="For 2 weeks. Then start following tablet. ५ आठवड्यांसाठी. नंतर खालील गोळी सुरू करणे.">iv) For 2 weeks. Then start following tablet. ५ आठवड्यांसाठी. नंतर खालील गोळी सुरू करणे.</option>
                        </select>
                    </div>
                </div>

                <!-- 3. Ferritin Selector & Dosage -->
                <div class="form-row">
                    <div class="form-group">
                        <label>3) For Ferritin Medications</label>
                        <button type="button" class="btn-popup-trigger" onclick="openModal('feModal')">
                            <span>Select Ferritin Options...</span>
                            <span>▼</span>
                        </button>
                        <div class="selected-tags-box" id="feTagsBox"></div>
                    </div>
                    <div class="form-group">
                        <label for="select_fe_dosage">Ferritin Dosage Duration / Doses</label>
                        <select id="select_fe_dosage" name="select_fe_dosage">
                            <option value="" selected disabled>Select duration/doses...</option>
                            <option value="1 month (१ महिन्यासाठी)">1 month (१ महिन्यासाठी)</option>
                            <option value="2 months (२ महिन्यांसाठी)">2 months (२ महिन्यांसाठी)</option>
                            <option value="3 months (३ महिन्यांसाठी)">3 months (३ महिन्यांसाठी)</option>
                            <option value="6 months (६ महिन्यांसाठी)">6 months (६ महिन्यांसाठी)</option>
                            <option value="9 months (९ महिन्यांसाठी)">9 months (९ महिन्यांसाठी)</option>
                            <option value="12 months (१२ महिन्यांसाठी)">12 months (१२ महिन्यांसाठी)</option>
                            <option value="3 doses. Then start following tablet ३ डोस. नंतर खालील गोळी सुरू करणे.">3 doses. Then start following tablet ३ डोस. नंतर खालील गोळी सुरू करणे.</option>
                            <option value="2 doses. Then start following tablet २ डोस. नंतर खालील गोळी सुरू करणे.">2 doses. Then start following tablet २ डोस. नंतर खालील गोळी सुरू करणे.</option>
                            <option value="Single dose. Then start following tablet एक डोस. नंतर खालील गोळी सुरू करणे.">Single dose. Then start following tablet एक डोस. नंतर खालील गोळी सुरू करणे.</option>
                            <option value="4 doses. Then start following tablet ४ डोस. नंतर खालील गोळी सुरू करणे.">4 doses. Then start following tablet ४ डोस. नंतर खालील गोळी सुरू करणे.</option>
                        </select>
                    </div>
                </div>

            </div>

            <div class="mode-buttons-row">
                <button type="button" class="btn-mode" id="btnAnnual" onclick="toggleSubForm('annual')">Annual Prescription</button>
                <button type="button" class="btn-mode" id="btnDexa" onclick="toggleSubForm('dexa')">DEXA Scan</button>
            </div>

            <!-- Annual Sub-Form (Hidden by default) -->
            <div class="sub-form-container" id="formAnnual">
                <h3 style="margin-bottom: 0.5rem; color: #0369a1; font-size: 1.1rem;">Annual Prescription Particulars</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="annual_shoulder">Shoulder Select</label>
                        <select id="annual_shoulder" name="annual_shoulder">
                            <option value="" disabled selected>Select side option...</option>
                            <option value="LEFT">i) LEFT</option>
                            <option value="RIGHT">ii) RIGHT</option>
                            <option value="BILATERAL">iii) BILATERAL</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="follow_up_date">Annual Follow-up Date</label>
                        <input type="date" id="follow_up_date" name="follow_up_date">
                    </div>
                </div>
            </div>

            <!-- DEXA Scan Sub-Form (Hidden by default) -->
            <div class="sub-form-container" id="formDexa">
                <h3 style="margin-bottom: 0.5rem; color: #0369a1; font-size: 1.1rem;">DEXA Scan Metrics & Treatment</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="lateral_spine">Lateral Spine</label>
                        <input type="number" step="any" id="lateral_spine" name="lateral_spine" placeholder="Enter float...">
                    </div>
                    <div class="form-group">
                        <label for="hip_lumbar_spine">Hip and Lumbar Spine</label>
                        <input type="number" step="any" id="hip_lumbar_spine" name="hip_lumbar_spine" placeholder="Enter float...">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="dexa_select_option">DEXA Select Option</label>
                        <select id="dexa_select_option" name="dexa_select_option">
                            <option value="" selected disabled>Select option...</option>
                            <option value="TAB.BONET 150 MG (Ibandronic Acid) Once a month (Take on empty stomach, early morning with full glass of plain water. Do not lie down for 1 hour.) महिना एकदा">i) TAB.BONET 150 MG (Ibandronic Acid) Once a month (Take on empty stomach, early morning with full glass of plain water. Do not lie down for 1 hour.) महिना एकदा</option>
                            <option value="TAB.ZOLENDRONIC ACID 5 MG IV Infusion once a year वर्षभरातून एकदा">ii) TAB.ZOLENDRONIC ACID 5 MG IV Infusion once a year वर्षभरातून एकदा</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="dexa_dosage">DEXA Dosage Duration</label>
                        <select id="dexa_dosage" name="dexa_dosage">
                            <option value="" selected disabled>Select duration...</option>
                            <option value="For 6 months (६ महिन्यांसाठी)">i) For 6 months (६ महिन्यांसाठी)</option>
                            <option value="For 1 year (१ वर्षासाठी)">ii) For 1 year (१ वर्षासाठी)</option>
                            <option value="For 2 years (२ वर्षांसाठी)">iii) For 2 years (२ वर्षांसाठी)</option>
                            <option value="For 3 years (३ वर्षांसाठी)">iv) For 3 years (३ वर्षांसाठी)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="btn-submit-container">
                <button type="submit" id="btnSubmit" class="btn-main-submit">Generate Prescription</button>
            </div>

        </form>
    </main>

    <!-- Modals for Selection Popups -->
    <div class="modal-overlay" id="hcModal">
        <div class="modal-box">
            <div class="modal-title">Select Homocysteine Options</div>
            <div class="checkbox-stack">
                <label class="checkbox-label"><input type="checkbox" name="hc_med" value="TAB.SUBNEURO B6/ MALTIDA FORTE / ME 12 OD (Vit B12)"> i) TAB.SUBNEURO B6/ MALTIDA FORTE / ME 12 OD (Vit B12)</label>
                <label class="checkbox-label"><input type="checkbox" name="hc_med" value="INJ. NERVIJEN 1500 plus Once a week (आठवड्यातून एकदा) For 6 weeks. Then start following tablet (६ आठवड्यांसाठी. नंतर खालील गोळी सुरू करणे)"> ii) INJ. NERVIJEN 1500 plus Once a week (आठवड्यातून एकदा) For 6 weeks. Then start following tablet (६ आठवड्यांसाठी. नंतर खालील गोळी सुरू करणे)</label>
                <label class="checkbox-label"><input type="checkbox" name="hc_med" value="NONE"> iii) No Medications (nothing should be shown on prescription)</label>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-modal-close" onclick="closeModal('hcModal')">Cancel</button>
                <button type="button" class="btn-modal-apply" onclick="applySelection('hc')">Apply Selection</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="vitModal">
        <div class="modal-box">
            <div class="modal-title">Select Vit D Options</div>
            <div class="checkbox-stack">
                <label class="checkbox-label"><input type="checkbox" name="vit_med" value="TAB.UPRISE D3 60 K/CAP.LUMIA 60K (Vit D) Once a month महिन्यातून एकदा"> i) TAB.UPRISE D3 60 K/CAP.LUMIA 60K (Vit D) Once a month महिन्यातून एकदा</label>
                <label class="checkbox-label"><input type="checkbox" name="vit_med" value="INJ. ARACHITOL 6 Lakh Unit to be taken orally (Break the ampoule, mix with a cup of milk & drink.)(अँप्युल फोडून एका कप दुधात मिक्स करून प्या.) Once a week (आठवड्यातून एकदा)"> ii) INJ. ARACHITOL 6 Lakh Unit to be taken orally (Break the ampoule, mix with a cup of milk & drink.)(अँप्युल फोडून एका कप दुधात मिक्स करून प्या.) Once a week (आठवड्यातून एकदा)</label>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-modal-close" onclick="closeModal('vitModal')">Cancel</button>
                <button type="button" class="btn-modal-apply" onclick="applySelection('vit')">Apply Selection</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="feModal">
        <div class="modal-box">
            <div class="modal-title">Select Ferritin Options</div>
            <div class="checkbox-stack">
                <label class="checkbox-label"><input type="checkbox" name="fe_med" value="CAP.OROFER XT / AUTRIN (ferrous ascorbate) Empty stomach. (रिकाम्या पोटी. एक दिवसा आड)"> i) CAP.OROFER XT / AUTRIN (ferrous ascorbate) Empty stomach. (रिकाम्या पोटी. एक दिवसा आड)</label>
                <label class="checkbox-label"><input type="checkbox" name="fe_med" value="TAB.LIMCEE(vit C) Empty stomach. Alternate day (रिकाम्या पोटी. एक दिवसा आड)"> ii) TAB.LIMCEE(vit C) Empty stomach. Alternate day (रिकाम्या पोटी. एक दिवसा आड)</label>
                <label class="checkbox-label"><input type="checkbox" name="fe_med" value="Inj. IRNY 1 gm / FERIUM 1 gm (dilute 2 vial of 10ml or 1vial of 20ml in 250ml NS give as slow IV infusion over 40 minutes ) Once in 15 days १५ दिवसांतून एकदा"> iii) Inj. IRNY 1 gm / FERIUM 1 gm (dilute 2 vial of 10ml or 1vial of 20ml in 250ml NS give as slow IV infusion over 40 minutes ) Once in 15 days १५ दिवसांतून एकदा</label>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-modal-close" onclick="closeModal('feModal')">Cancel</button>
                <button type="button" class="btn-modal-apply" onclick="applySelection('fe')">Apply Selection</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDshtIK7BVa5gRVXL1TJB3yIlXWhbiNUsY",
            authDomain: "mediscript-16c4b.firebaseapp.com",
            projectId: "mediscript-16c4b",
            storageBucket: "mediscript-16c4b.firebasestorage.app",
            messagingSenderId: "452512782717",
            appId: "1:452512782717:web:ca7c3bab69678efe019414"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('system_date').value = new Date().toISOString().split('T')[0];

        window.openModal = function(modalId) {
            document.getElementById(modalId).style.display = 'flex';
        }

        window.closeModal = function(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        window.applySelection = function(type) {
            let name = type + '_med';
            let boxId = type + 'TagsBox';
            let modalId = type + 'Modal';

            const checkboxes = document.querySelectorAll(`input[name="${name}"]:checked`);
            const tagsBox = document.getElementById(boxId);
            tagsBox.innerHTML = '';

            checkboxes.forEach(cb => {
                let pill = document.createElement('div');
                pill.className = 'tag-pill';
                pill.textContent = cb.value.substring(0, 35) + '...';
                tagsBox.appendChild(pill);
            });

            closeModal(modalId);
        }

        window.toggleSubForm = function(targetMode) {
            const button = targetMode === 'annual' ? document.getElementById('btnAnnual') : document.getElementById('btnDexa');
            const container = targetMode === 'annual' ? document.getElementById('formAnnual') : document.getElementById('formDexa');

            if (button.classList.contains('active')) {
                button.classList.remove('active');
                container.style.display = 'none';
            } else {
                button.classList.add('active');
                container.style.display = 'flex';
            }

            const annualActive = document.getElementById('btnAnnual').classList.contains('active');
            const dexaActive = document.getElementById('btnDexa').classList.contains('active');

            let unifiedMode = 'none';
            if (annualActive && dexaActive) { unifiedMode = 'annual, dexa'; } 
            else if (annualActive) { unifiedMode = 'annual'; } 
            else if (dexaActive) { unifiedMode = 'dexa'; }

            document.getElementById('selected_mode').value = unifiedMode;
        }

        window.checkAndAutofillMRD = async function() {
            const mrdInput = document.getElementById('mrd_no').value.trim();
            const statusBadge = document.getElementById('autofillStatus');
            
            if(!mrdInput) {
                statusBadge.style.display = "none";
                return;
            }

            try {
                const q = query(collection(db, "prescriptions"), where("mrd_no", "==", mrdInput));
                const querySnapshot = await getDocs(q);

                if(!querySnapshot.empty) {
                    let matches = [];
                    querySnapshot.forEach((doc) => {
                        matches.push({ id: doc.id, ...doc.data() });
                    });

                    matches.sort((a, b) => new Date(b.date) - new Date(a.date));
                    const latestRecord = matches[0];

                    document.getElementById('patient_name').value = latestRecord.patient_name || "";
                    document.getElementById('hc_val').value = latestRecord.hc_val && latestRecord.hc_val !== "-" ? latestRecord.hc_val : "";
                    document.getElementById('vit_d').value = latestRecord.vit_d && latestRecord.vit_d !== "-" ? latestRecord.vit_d : "";
                    document.getElementById('fe_val').value = latestRecord.fe_val && latestRecord.fe_val !== "-" ? latestRecord.fe_val : "";
                    
                    statusBadge.style.display = "block";
                    statusBadge.innerText = `🔄 Patient History Found! Loaded previous data.`;
                    setTimeout(() => { statusBadge.style.display = "none"; }, 8000);
                } else {
                    statusBadge.style.display = "none";
                }
            } catch (err) {
                console.error("History lookup error:", err);
            }
        }

        window.saveToFirebase = async function(event) {
            event.preventDefault();
            
            document.getElementById('system_date').value = new Date().toISOString().split('T')[0];

            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.innerText = "Processing & Saving...";
            btnSubmit.disabled = true;

            const getCheckedValues = (name) => {
                const checkboxes = document.querySelectorAll(`input[name="${name}"]:checked`);
                let values = [];
                checkboxes.forEach((cb) => values.push(cb.value));
                return values.length > 0 ? values : ["-"];
            };

            const modeValue = document.getElementById('selected_mode').value;
            const isAnnual = modeValue.includes('annual');
            const isDexa = modeValue.includes('dexa');

            const formData = {
                mrd_no: document.getElementById('mrd_no').value || "-",
                patient_name: document.getElementById('patient_name').value,
                date: document.getElementById('system_date').value,
                
                hc_val: document.getElementById('hc_val').value || "-",
                vit_d: document.getElementById('vit_d').value || "-",
                fe_val: document.getElementById('fe_val').value || "-",

                hc_selections: getCheckedValues('hc_med'),
                vit_selections: getCheckedValues('vit_med'),
                vit_dosage: document.getElementById('select_vit_dosage').value || "-",
                fe_selections: getCheckedValues('fe_med'),
                fe_dosage: document.getElementById('select_fe_dosage').value || "-",

                selected_mode: modeValue,
                type: modeValue.toUpperCase(),

                annual_shoulder: isAnnual ? document.getElementById('annual_shoulder').value || "-" : "-",
                follow_up_date: isAnnual ? document.getElementById('follow_up_date').value || "-" : "-",
                shoulder: isAnnual ? (document.getElementById('annual_shoulder').value || "-") : "-",
                custom_val: isAnnual ? (document.getElementById('follow_up_date').value || "-") : "-",
                
                lateral_spine: isDexa ? document.getElementById('lateral_spine').value || "-" : "-",
                hip_lumbar_spine: isDexa ? document.getElementById('hip_lumbar_spine').value || "-" : "-",
                dexa_select_option: isDexa ? document.getElementById('dexa_select_option').value || "-" : "-",
                dexa_dosage: isDexa ? document.getElementById('dexa_dosage').value || "-" : "-",
                ls: isDexa ? (document.getElementById('lateral_spine').value || "-") : "-",
                hl: isDexa ? (document.getElementById('hip_lumbar_spine').value || "-") : "-"
            };

            try {
                const docRef = await addDoc(collection(db, "prescriptions"), formData);
                window.location.href = `view.html?id=${docRef.id}`;
            } catch (error) {
                console.error("Firebase Sync Error:", error);
                alert("Cloud storage connection error. Please verify network access.");
                btnSubmit.innerText = "Generate Prescription";
                btnSubmit.disabled = false;
            }
        }
    </script>
</body>
</html>
